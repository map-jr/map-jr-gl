<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Feature gallery</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f5f2; --card: #fff; --ink: #1d1d1f; --muted: #6b6b70; --line: #e3e1dc; --code: #f3f1ec; }
  @media (prefers-color-scheme: dark) { :root { --bg: #17181a; --card: #222326; --ink: #f1f1f3; --muted: #a2a2a8; --line: #34353a; --code: #1a1b1e; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, sans-serif; }
  header, main { max-width: 1180px; margin: 0 auto; padding: 0 max(20px, env(safe-area-inset-left)); }
  header { padding-top: 32px; padding-bottom: 8px; }
  h1 { font-size: 26px; margin: 0 0 6px; }
  header p { margin: 0; color: var(--muted); max-width: 72ch; }
  a { color: inherit; }
  main { padding-bottom: 56px; }
  /* One map per row: the map on the left, what it shows and the code for it on the right. */
  article { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-top: 22px; }
  @media (max-width: 820px) { article { grid-template-columns: minmax(0, 1fr); } }
  .map { min-height: 400px; position: relative; background: #e9e6df; }
  .map > .live, .map > img { position: absolute; inset: 0; width: 100%; height: 100%; }
  .map > img { object-fit: cover; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); min-height: 400px; }
  .pair > * { position: relative; overflow: hidden; background: #e9e6df; min-height: 200px; }
  .pair img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .tag { position: absolute; left: 8px; top: 8px; z-index: 4; background: rgba(0, 0, 0, .62); color: #fff; font-size: 11px; padding: 2px 7px; border-radius: 10px; pointer-events: none; }
  .text { padding: 18px 20px; display: flex; flex-direction: column; min-width: 0; }
  h2 { font-size: 17px; margin: 0 0 6px; }
  .text p { margin: 0 0 6px; color: var(--muted); font-size: 14px; }
  .text ul { margin: 0 0 8px; padding-left: 18px; color: var(--muted); font-size: 14px; }
  pre { margin: 8px 0 0; padding: 12px 14px; background: var(--code); border-radius: 8px; overflow: auto; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; tab-size: 2; flex: 1; }
  .readout { margin-top: 10px; font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; min-height: 1.4em; overflow-wrap: anywhere; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  button { font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>Feature gallery</h1>
  <p>Each row is a live map and the code that makes it. Maps start when they scroll into view. Drag to move, scroll or pinch to zoom, and drag with the right button (or two fingers) to tilt and turn.</p>
</header>
<main id="rows"></main>
<script type="module" src="./gallery.js"></script>
</body>
</html>
