<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Playground · Map Jr. GL</title>
<style>
  :root { color-scheme: light dark; --bg: #fff; --ink: #1a1a1a; --muted: #666; --line: #d8d8d8; --accent: #2563eb; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1c1c1e; --ink: #f2f2f2; --muted: #aaa; --line: #3a3a3c; --accent: #60a5fa; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font: 15px/1.4 system-ui, -apple-system, sans-serif; color: var(--ink); }
  #map { position: fixed; inset: 0; }
  #panel { position: fixed; z-index: 3; top: max(8px, env(safe-area-inset-top)); left: 8px; width: min(340px, calc(100vw - 16px));
    max-height: calc(100dvh - 16px - env(safe-area-inset-top)); overflow: auto; overscroll-behavior: contain;
    background: color-mix(in srgb, var(--bg) 94%, transparent); border-radius: 12px; box-shadow: 0 2px 12px #0004; }
  #panel > summary { list-style: none; cursor: pointer; min-height: 48px; padding: 12px 16px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
  #panel > summary::-webkit-details-marker { display: none; }
  #panel > summary::after { content: "Show"; font-weight: 400; color: var(--accent); }
  #panel[open] > summary::after { content: "Hide"; }
  fieldset { border: 0; border-top: 1px solid var(--line); margin: 0; padding: 10px 16px 12px; }
  legend { float: left; width: 100%; padding: 0; margin-bottom: 4px; font-weight: 600; font-size: 13px; color: var(--muted); }
  label.row { display: grid; grid-template-columns: 9.5em 1fr 3em; align-items: center; gap: 8px; min-height: 44px; clear: both; font-size: 14px; }
  label.row output { text-align: right; font-variant-numeric: tabular-nums; font-size: 13px; }
  input[type=range] { width: 100%; height: 44px; margin: 0; accent-color: var(--accent); }
  input[type=color] { width: 100%; height: 36px; border: 1px solid var(--line); border-radius: 8px; padding: 2px; background: none; }
  label.toggle { display: flex; align-items: center; gap: 10px; min-height: 44px; clear: both; }
  label.toggle input { width: 24px; height: 24px; accent-color: var(--accent); }
  .group { display: flex; gap: 8px; flex-wrap: wrap; clear: both; }
  button { font: inherit; min-height: 44px; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; }
  button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .note { margin: 0; padding: 10px 16px 14px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); }
  .note a { color: inherit; }
</style>
</head>
<body>
<div id="map"></div>
<details id="panel" open>
  <summary>Playground</summary>
  <fieldset>
    <legend>Camera</legend>
    <label class="row">Pitch <input type="range" id="pitch" min="0" max="90" step="1"><output></output></label>
    <label class="row">Bearing <input type="range" id="bearing" min="-180" max="180" step="1"><output></output></label>
    <label class="row">Zoom <input type="range" id="zoom" min="0" max="20" step="0.1"><output></output></label>
  </fieldset>
  <fieldset>
    <legend>Views</legend>
    <div class="group">
      <button type="button" data-view="city">New York at pitch 85</button>
      <button type="button" data-view="alps">The Alps with terrain</button>
      <button type="button" data-view="globe">The whole globe</button>
      <button type="button" id="reset">Reset</button>
    </div>
  </fieldset>
  <fieldset>
    <legend>Sky and fog</legend>
    <label class="toggle"><input type="checkbox" id="sky"> Draw the sky</label>
    <label class="row">sky-color <input type="color" id="sky-color"><output></output></label>
    <label class="row">horizon-color <input type="color" id="horizon-color"><output></output></label>
    <label class="row">fog-color <input type="color" id="fog-color"><output></output></label>
    <label class="row">sky-horizon-blend <input type="range" id="sky-horizon-blend" min="0" max="1" step="0.01"><output></output></label>
    <label class="row">horizon-fog-blend <input type="range" id="horizon-fog-blend" min="0" max="1" step="0.01"><output></output></label>
    <label class="row">fog-ground-blend <input type="range" id="fog-ground-blend" min="0" max="1" step="0.01"><output></output></label>
    <label class="row">atmosphere-blend <input type="range" id="atmosphere-blend" min="0" max="1" step="0.01"><output></output></label>
  </fieldset>
  <fieldset>
    <legend>Terrain</legend>
    <label class="toggle"><input type="checkbox" id="terrain"> 3D terrain</label>
    <label class="row">Exaggeration <input type="range" id="exaggeration" min="0" max="3" step="0.1"><output></output></label>
    <label class="toggle"><input type="checkbox" id="hillshade"> Hillshade</label>
  </fieldset>
  <fieldset>
    <legend>Projection</legend>
    <div class="group" role="group" aria-label="Projection">
      <button type="button" data-projection="mercator">Mercator</button>
      <button type="button" data-projection="globe">Globe</button>
    </div>
  </fieldset>
  <fieldset>
    <legend>Renderer (the page reloads)</legend>
    <div class="group" role="group" aria-label="Renderer">
      <button type="button" data-renderer="worker">Worker</button>
      <button type="button" data-renderer="main">Main thread</button>
    </div>
  </fieldset>
  <p class="note">The page keeps its state in the URL, so a link to it shows the same view. It uses the entry
    <code>@map-jr/map-jr-gl/maplibre-compat</code>. On the globe, the map draws no sky, no fog and no 3D terrain.
    <a href="./">Back to the gallery</a></p>
</details>
<script type="module" src="./playground.js"></script>
</body>
</html>
