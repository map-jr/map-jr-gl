# The checks that a change must pass before it is merged. Runs for each pull request, for each group of the merge
# queue of main (#2579), and for each push to main. A merge group runs every job, as a push does.
# (The workflow "Browsers" measures and tests in three browsers on three systems after a merge; it does not gate.)
name: CI
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Which of the slow jobs a pull request needs. A push to main and a group of the merge queue run all of them.
  # A pull request that changes only
  # documents, or tools and tests that no browser job reads (scripts/ci-paths.mjs), skips "browser", and one that changes nothing that the built files or the render tests read skips
  # "render". A skipped job counts as passed for a required check, so these jobs can stay required.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      browser: ${{ steps.files.outputs.browser }}
      render: ${{ steps.files.outputs.render }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: files
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then echo "browser=true" >> "$GITHUB_OUTPUT"; echo "render=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files="$(git diff --name-only "$BASE"...HEAD)"
          # Documents and the tools and tests that no browser job reads (the list is NO_BROWSER of
          # scripts/ci-paths.mjs; "checks" runs its --check, which fails when a browser job reads a skipped file).
          browser=$(node scripts/ci-paths.mjs <<< "$files" | sed 's/^browser=//')
          render=false
          while read -r f; do
            [ -z "$f" ] && continue
            echo "$f"
            # What the built files and the render tests are made from.
            case "$f" in
              src/*|build.mjs|package.json|pnpm-lock.yaml|tsconfig*.json|scripts/private-names.mjs|scripts/minify-shaders.mjs|scripts/gl-constants.mjs|test/conformance/render*|.github/workflows/ci.yml) render=true ;;
            esac
          done <<< "$files"
          echo "browser=$browser" >> "$GITHUB_OUTPUT"; echo "render=$render" >> "$GITHUB_OUTPUT"
          echo "browser: $browser, render: $render" | tee -a "$GITHUB_STEP_SUMMARY"

  # Types, build, unit tests, conformance floors, size budgets, examples, and the agreement of code and documents.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Prettier of website/: the recipes check and the format check of docs-lint skip without it.
      - run: pnpm --dir website install --frozen-lockfile
      # Type check, build, and the type declarations that the package publishes.
      - run: pnpm build
      # The tarball that npm would publish: publint, the files that package.json names, and the source maps.
      - run: pnpm test:package
      - run: pnpm test
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            dist
            site-dist
          if-no-files-found: ignore
          retention-days: 3

  # The behaviour of the map in a browser (Chromium): both entries, the adapters, and the ways to load the library.
  # interact.mjs and host.mjs each run in two parallel jobs, one for each renderer (issue #519): RENDERER=worker runs
  # the checks of the worker renderer, and RENDERER=main the checks of the main renderer and every check after the
  # loop over the renderers. The adapters and loading.mjs (about 1.2 minutes) run in the shortest part. Each job
  # starts its own demo server. The timeout of a part holds its setup and two runs of its slowest suite (for
  # host-worker: one run of every suite and one rerun of the slowest), plus a margin of 20 percent, from the 19 runs of
  # CI of 2026-11-27 (#2368). The slowest suite takes 14.3 minutes (interact-main), 13.5 (host-main), 9.2 (interact-worker)
  # and about 5.3 (host.mjs in host-worker); the setup takes at most 1.3. Measure again when a suite gets slower.
  browser-part:
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    name: browser-${{ matrix.part }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: interact-main
            renderer: main
            suites: '"test/interact.mjs .cache/shots"'
            timeout: 36
          - part: interact-worker
            renderer: worker
            suites: '"test/interact.mjs .cache/shots"'
            timeout: 24
          - part: host-main
            renderer: main
            suites: 'test/host.mjs'
            timeout: 34
          - part: host-worker
            renderer: worker
            suites: 'test/host.mjs test/vue.mjs test/element.mjs test/react.mjs test/loading.mjs'
            timeout: 21
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The browser driver is not a dependency of the package: the development machine has its own copy.
      - run: pnpm add -D playwright@1.65.1
      # The system packages come from the Ubuntu mirror, which can be out of reach for a while (#1091): try 3 times.
      - name: Install the browser and its system packages
        shell: bash
        run: for i in 1 2 3; do pnpm exec playwright install --with-deps chromium && exit 0; echo "::warning::the install failed (attempt $i of 3)"; sleep 30; done; exit 1
      - run: node build.mjs && node scripts/site.mjs
      - name: Behaviour tests
        env:
          SUITES: ${{ matrix.suites }}
          RENDERER: ${{ matrix.renderer }}
        run: |
          PORT=8080 node demo/serve.mjs &
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:8080/ && break; sleep 1; done
          # Each suite prints PASS and FAIL lines. A suite is run again one time when it fails: the tiles come from
          # the live network, and one slow answer must not stop a merge. A test that fails two times is a failure.
          status=0
          eval "set -- $SUITES"
          for suite in "$@"; do
            mkdir -p .cache/shots
            # $suite is a script and its arguments, so it is split on purpose.
            # shellcheck disable=SC2086
            if ! node $suite > out.txt 2>&1 || grep -q "^FAIL" out.txt; then
              echo "::warning::$suite failed one time; running it again"; grep "^FAIL" out.txt || tail -5 out.txt
              # shellcheck disable=SC2086
              if ! node $suite > out.txt 2>&1 || grep -q "^FAIL" out.txt; then grep "^FAIL" out.txt || tail -20 out.txt; echo "::error::$suite failed"; status=1; fi
            fi
            echo "$suite: $(grep -c '^PASS' out.txt) passed, $(grep -c '^FAIL' out.txt) failed" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          exit $status

  # The required check. It passes when every browser job passed, or when "changes" skipped them for a pull request
  # that changes only files that no browser job reads. It fails when one of them failed or timed out. When they or "changes" were cancelled (a newer
  # push cancels the run) and none failed, it cancels the run again, so that this job ends as cancelled and not as a
  # failure: a cancelled job never passes a required check, and a failure then always means a failed test.
  browser:
    needs: [changes, browser-part]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          CHANGES: ${{ needs.changes.result }}
          WANTED: ${{ needs.changes.outputs.browser }}
          PARTS: ${{ needs.browser-part.result }}
        run: |
          echo "changes: $CHANGES, browser wanted: $WANTED, browser jobs: $PARTS" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$CHANGES" = cancelled ] || [ "$PARTS" = cancelled ]; then
            echo "the browser jobs were cancelled; cancelling this job too"
            gh api -X POST "repos/$REPO/actions/runs/$RUN_ID/force-cancel" || true
            sleep 120
          fi
          if [ "$CHANGES" != success ]; then echo "::error::the job changes did not succeed"; exit 1; fi
          if [ "$WANTED" != true ] && [ "$PARTS" = skipped ]; then exit 0; fi
          if [ "$PARTS" != success ]; then echo "::error::a browser job did not succeed ($PARTS)"; exit 1; fi

  # MapLibre's own render tests, against test/conformance/render-tests.json (#1915). A test that is worse than its line
  # fails here, and so does a run with fewer matches than the file has lines "match". A test that is better than its
  # line is printed as BETTER:, so that the author commits its line.
  render:
    needs: changes
    if: needs.changes.outputs.render == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm add -D playwright@1.65.1
      # The system packages come from the Ubuntu mirror, which can be out of reach for a while (#1091): try 3 times.
      - name: Install the browser and its system packages
        shell: bash
        run: for i in 1 2 3; do pnpm exec playwright install --with-deps chromium && exit 0; echo "::warning::the install failed (attempt $i of 3)"; sleep 30; done; exit 1
      - uses: actions/cache@v6
        with:
          path: .cache/maplibre-gl-js
          key: maplibre-tests-${{ hashFiles('test/conformance/render.mjs', 'test/conformance/maplibre-checkout.mjs') }}
      # The tiles of the real-world tests (#665): a download of 32 MB that changes only with the version in the module.
      - uses: actions/cache@v6
        with:
          path: .cache/mvt-fixtures-*
          key: mvt-fixtures-${{ hashFiles('test/conformance/mvt-fixtures.mjs') }}
      - run: node build.mjs
      # (`shell: bash` sets pipefail, so a failing run fails the step and not only `tee`; #1481.)
      - run: pnpm test:render | tee render.txt
        shell: bash
      - run: (head -2 render.txt; grep -E '^(WORSE|BETTER|FAIL):' render.txt || true) >> "$GITHUB_STEP_SUMMARY"
        if: always()
