# Publishes the package to npm when a tag of a version is pushed (v0.3.0). See "How a release is made" in
# docs/development.md. The repository stores no token of npm: npm trusts this workflow by its file name (a trusted
# publisher in the settings of the package on npmjs.com), and the job proves its identity with OpenID Connect.
# npm then adds a provenance statement, which names the commit and the run of this workflow.
#
# If you rename this file, change the trusted publisher on npmjs.com: npm compares the file name.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  publish:
    # (Trusted publishing needs a runner that GitHub hosts.)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # The job may ask GitHub for the identity token that npm checks.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      # Trusted publishing needs Node.js 22.14.0 or later and npm 11.5.1 or later. Node.js 24 has such an npm. No
      # cache of the package manager is used for a release, as the documentation of npm advises.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: The tag is the version of package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME, and package.json has the version $version. Push the tag v$version, or change the version in a pull request first."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_ENV"
          echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_ENV"
      - name: npm is new enough for trusted publishing
        run: |
          node -e "const [a, b, c] = process.argv[1].split('.').map(Number); if (a < 11 || (a === 11 && (b < 5 || (b === 5 && c < 1)))) { console.error('::error::npm ' + process.argv[1] + ' is older than 11.5.1, which trusted publishing needs.'); process.exit(1); }" "$(npm --version)"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      # The tarball as npm publishes it: publint, arethetypeswrong, the source maps, and an application that installs it.
      - run: pnpm test:package
      # The first version is published by hand, because npm has no settings for a package that does not exist yet.
      # For such a version the tag only records the commit.
      - name: Is this version on npm already?
        run: |
          if [ "$(npm view "$name@$version" version 2>/dev/null)" = "$version" ]; then
            echo "::notice::$name $version is on npm already. Nothing is published."
            echo "published=yes" >> "$GITHUB_ENV"
          fi
      - name: Publish
        if: env.published != 'yes'
        run: npm publish --provenance --access public
