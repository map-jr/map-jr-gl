# Measures and checks the library in Chromium, Firefox and WebKit on Linux, macOS and Windows. When it is started by
# hand, it can also run Safari itself (on macOS and, when asked, in the iOS Simulator).
# The results go to the branch "bench-results" (one file for each system and browser, and a README with all of them).
name: Browsers
on:
  push:
    branches: [main]
    paths: ['src/**', 'demo/**', 'test/**', 'scripts/**', 'site/**', 'build.mjs', 'package.json', '.github/workflows/browsers.yml']
  workflow_dispatch:
    inputs:
      safari:
        description: Also run the Safari job (Safari on macOS, through safaridriver)
        type: boolean
        default: false
      safari_only:
        description: Run only the Safari job, and do not write the branch bench-results (to try a change of that job)
        type: boolean
        default: false
      simulator:
        description: In the Safari job, also try Safari of the iOS Simulator (it does not start in each run)
        type: boolean
        default: false
permissions:
  contents: write
# A run takes longer than the time between pushes, so a run that has started is left to finish. A newer push waits.
concurrency:
  group: browsers
  cancel-in-progress: false
jobs:
  run:
    if: ${{ !inputs.safari_only }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        browser: [chromium, firefox, webkit]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The browser driver is not a dependency of the package: the development machine has its own copy.
      - run: pnpm add -D playwright@1.63.0
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - run: node build.mjs && node scripts/site.mjs
      - name: Benchmark and checks
        run: |
          PORT=8080 node demo/serve.mjs &
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:8080/ && break; sleep 1; done
          mkdir -p results
          # Firefox runs with a window (see test/launch.mjs). On Linux, xvfb is the display.
          if [ "${{ matrix.browser }}" = firefox ]; then export HEADED=1; fi
          run=""; if [ "${{ runner.os }}" = Linux ]; then run="xvfb-run -a"; fi
          $run node test/bench/browsers.mjs results || echo "benchmark script failed" > "results/${{ runner.os }}-${{ matrix.browser }}-failed.txt"
          # The behaviour tests, in this browser. Failures are recorded; they do not stop the run.
          name="$(node -e "console.log(require('os').platform())")-${{ matrix.browser }}"
          (($run node test/interact.mjs results/shots; $run node test/host.mjs; $run node test/vue.mjs; $run node test/react.mjs) 2>&1 | grep -E "^(PASS|FAIL)" | cut -c1-600 > "results/$name-tests.txt") || true
          rm -rf results/shots
          cat results/*.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.os }}-${{ matrix.browser }}
          path: results
  # Safari itself, which Playwright cannot drive (its "webkit" is another build of the engine). safaridriver is part of
  # macOS; test/bench/webdriver.mjs speaks to it. The machine has a virtual GPU, so the frame rates say little; what
  # counts here is what Safari can do (OffscreenCanvas in a worker and its contexts), which renderer the map takes,
  # and that the benchmark runs to its end.
  # The job runs only when the workflow is started by hand with "safari" or "safari_only": it tells little that changes
  # from one merge to the next, and it would make each run of the workflow longer.
  # Known on this machine (2026-11-12, Safari 27.2): the WebGL context of a worker is lost at once, so the scenarios of
  # the worker renderer fail here. On a Mac with a GPU the worker renderer works in the same Safari (the owner's check).
  safari:
    if: ${{ inputs.safari || inputs.safari_only }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node build.mjs && node scripts/site.mjs
      - name: Start the demo server and safaridriver
        run: |
          PORT=8080 node demo/serve.mjs &
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:8080/ && break; sleep 1; done
          sudo safaridriver --enable
          safaridriver -p 4444 &
          sleep 3
          mkdir -p results
          sw_vers; safaridriver --version || true
      # (Without markers and terrain: the GPU of this machine is virtual, so more scenarios would say nothing more.)
      - name: Safari on macOS
        run: BENCH_QUERY="nomarkers&noterrain" WD_NAME=darwin-safari node test/bench/webdriver.mjs results || echo "the benchmark did not finish" > results/darwin-safari-failed.txt
      # The same benchmark page as the gallery site has it (site-dist/bench/), so that the page that devices open
      # is tested too.
      - name: Safari on macOS, the benchmark page of the gallery site
        run: BENCH_URL=http://localhost:8080/gallery/bench/ BENCH_QUERY="nomarkers&noterrain" WD_NAME=darwin-safari-site-page node test/bench/webdriver.mjs results || echo "the benchmark did not finish" > results/darwin-safari-site-page-failed.txt
      # Safari of the iOS Simulator: the WebKit of that iOS version on the GPU of the host. It shows what iOS Safari can
      # do and which renderer the map takes. It does not show the speed or the memory limits of a phone.
      - name: Safari in the iOS Simulator
        if: ${{ inputs.simulator }}
        continue-on-error: true
        run: |
          udid=$(xcrun simctl list devices available -j | node -e "const d=JSON.parse(require('fs').readFileSync(0)).devices;const all=Object.entries(d).filter(([k])=>k.includes('iOS')).sort(([a],[b])=>b.localeCompare(a,undefined,{numeric:true})).flatMap(([,v])=>v);console.log((all.find(x=>/^iPhone/.test(x.name))||{}).udid||'')")
          if [ -z "$udid" ]; then echo "no iPhone simulator on this machine" > results/ios-simulator-safari-failed.txt; exit 0; fi
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" || true
          WD_CAPS="{\"browserName\":\"safari\",\"platformName\":\"iOS\",\"safari:useSimulator\":true,\"safari:deviceUDID\":\"$udid\"}" BENCH_QUERY="nomarkers&noterrain" WD_NAME=ios-simulator-safari \
            node test/bench/webdriver.mjs results || echo "the benchmark did not finish" > results/ios-simulator-safari-failed.txt
      - run: cat results/*.md >> "$GITHUB_STEP_SUMMARY" || true
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-safari
          path: results
  publish:
    needs: [run, safari]
    if: ${{ always() && !inputs.safari_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: all
          merge-multiple: true
      - name: Push the results to the branch bench-results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd all
          {
            echo "# Results in browsers"
            echo
            echo "Commit ${GITHUB_SHA}, $(date -u +%Y-%m-%dT%H:%MZ). The workflow \"Browsers\" writes this branch."
            echo
            echo "## Behaviour tests"
            echo
            echo "| System and browser | Pass | Fail |"
            echo "|---|---|---|"
            for f in *-tests.txt; do echo "| ${f%-tests.txt} | $(grep -c '^PASS' "$f") | $(grep -c '^FAIL' "$f") |"; done
            echo
            echo "## Benchmarks"
            echo
            cat *.md
            echo "## Failed behaviour tests"
            echo
            for f in *-tests.txt; do echo "### ${f%-tests.txt}"; echo; echo '```'; grep '^FAIL' "$f" || echo "(none)"; echo '```'; echo; done
          } > ../README.md
          mv ../README.md README.md
          git init -q -b bench-results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Results for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" bench-results
