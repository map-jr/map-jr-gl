# Builds the docs site (website/) and publishes it to Cloudflare at https://map-jr.org/.
#
# A pull request builds and checks the site and keeps the output as an artifact. A push to main also deploys it.
# The site also has the benchmark page at /bench/.
# One-time setup by the owner: the repository secrets CLOUDFLARE_API_TOKEN (a token with the permission
# "Edit Cloudflare Workers" for the account) and CLOUDFLARE_ACCOUNT_ID, and the zone map-jr.org in that account.
# Without the secrets, the deploy step writes a notice and the job passes.
#
# A pull request from a branch of this repository also uploads a preview version of the site
# (`wrangler versions upload --preview-alias pr-<number>`) and keeps one comment on the pull request with its URL. This
# needs "Preview URLs" turned on for the worker map-jr-site (Workers & Pages, Settings, Domains & Routes), and the token
# needs the same permission as the deploy. A pull request from a fork has no secrets and gets no preview.
name: Docs site
on:
  pull_request:
    # package.json is here because the header of the site shows the version of the library.
    paths: ['website/**', 'docs/**', 'examples/**', 'demo/bench.*', 'scripts/site.mjs', 'package.json', '.github/workflows/site.yml']
  push:
    branches: [main]
    paths: ['website/**', 'docs/**', 'examples/**', 'demo/bench.*', 'scripts/site.mjs', 'package.json', '.github/workflows/site.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true
jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      # Only for the comment with the preview URL; the token of a pull request from a fork is read-only anyway.
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            website/pnpm-lock.yaml
      # The site uses the library of this commit (`link:..` in website/package.json), so the library is built first.
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm install --frozen-lockfile
        working-directory: website
      # The clones of the styles repositories that the pages of /styles read (website/build/styles.ts). With a clone
      # from the cache, the build fetches it again and keeps the old clone when github.com does not answer, so one failed
      # fetch does not fail the build (#1515). Each run saves a new entry and restores the newest one.
      - uses: actions/cache@v6
        with:
          path: website/.data/sources
          key: site-sources-${{ github.run_id }}
          restore-keys: site-sources-
      - run: pnpm generate
        working-directory: website
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: website/.output/public
          include-hidden-files: true
          retention-days: 14
      # The check does not wait for the map of the home page, which needs the style and the tiles of other hosts. It
      # checks the table of contents on a phone also in WebKit.
      # The system packages of the browsers (about 140 MB of .deb files) come from the Ubuntu mirror, which sometimes
      # sends them at about 80 kB/s; apt's network timeouts do not fire on a slow transfer, and the step ran into its
      # timeout (#1328). The .deb files and the browsers are cached, keyed on the runner image and the Playwright
      # version, so a usual run downloads neither. Each attempt of apt runs under a `timeout` that runs as root and
      # kills its whole process group (Playwright runs apt-get itself when it is root, with no sudo that would start a
      # new session), so a stalled attempt ends and the next one finds no dpkg lock.
      - name: Name the cache of the browsers
        id: pw
        run: echo "key=site-playwright-$ImageOS-$ImageVersion-$(node -p "require('./website/package.json').devDependencies.playwright")" >> "$GITHUB_OUTPUT"
      - name: Restore the browsers and their system packages
        id: pw-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/ms-playwright
            ~/apt-debs
          key: ${{ steps.pw.outputs.key }}
      - name: Install Chromium and WebKit
        timeout-minutes: 19
        working-directory: website
        run: |
          echo 'Acquire::http::Timeout "30"; Acquire::https::Timeout "30"; Acquire::Retries "5"; APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/99ci
          sudo rm -f /etc/apt/apt.conf.d/docker-clean
          mkdir -p ~/apt-debs
          sudo cp ~/apt-debs/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          ok=
          for i in 1 2 3; do
            if sudo timeout -k 15 420 env "PATH=$PATH" pnpm exec playwright install-deps chromium webkit; then ok=1; break; fi
            echo "::warning::the install of the system packages failed or took more than 7 minutes (attempt $i of 3)"
            sudo pkill -x apt-get || true; sudo pkill -x dpkg || true; sudo dpkg --configure -a || true; sleep 10
          done
          [ -n "$ok" ] || exit 1
          for i in 1 2 3; do
            timeout -k 15 300 pnpm exec playwright install chromium webkit && break
            echo "::warning::the download of the browsers failed (attempt $i of 3)"
            [ "$i" = 3 ] && exit 1; sleep 10
          done
          cp /var/cache/apt/archives/*.deb ~/apt-debs/ 2>/dev/null || true
      - name: Save the browsers and their system packages
        if: steps.pw-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cache/ms-playwright
            ~/apt-debs
          key: ${{ steps.pw.outputs.key }}
      - run: pnpm check --no-map
        working-directory: website
      # The benchmark page at /bench/, so that a phone or a device farm can open it with no server of the project
      # (scripts/site.mjs builds it into site-dist/bench/). The site drops the trailing slash of a folder, so the page
      # gets a <base> that keeps its relative URLs in /bench/.
      - name: Add the benchmark page
        run: |
          node scripts/site.mjs
          cp -r site-dist/bench website/.output/public/bench
          sed -i 's|<head>|<head><base href="/bench/">|' website/.output/public/bench/index.html
          grep -q '<base href="/bench/">' website/.output/public/bench/index.html
      - name: Deploy to Cloudflare
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        working-directory: website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::The site was not deployed: the repository has no secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID."
            exit 0
          fi
          pnpm exec wrangler deploy
      - name: Preview on Cloudflare
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        working-directory: website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::No preview was uploaded: the repository has no secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID."
            exit 0
          fi
          export WRANGLER_OUTPUT_FILE_PATH="$RUNNER_TEMP/wrangler-output.ndjson"
          pnpm exec wrangler versions upload --preview-alias "pr-$PR" --message "Pull request #$PR, ${GITHUB_SHA::8}"
          url=$(jq -rs 'map(select(.type == "version-upload")) | last | .preview_alias_url // empty' "$WRANGLER_OUTPUT_FILE_PATH")
          if [ -z "$url" ]; then
            echo "::warning::The version was uploaded, but wrangler printed no preview URL. Turn on Preview URLs for the worker map-jr-site in the Cloudflare dashboard."
            exit 0
          fi
          body="Preview of the docs site at ${GITHUB_SHA::8}: $url <!-- map-jr-site-preview -->"
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq '.[] | select(.body | contains("map-jr-site-preview")) | .id' | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" > /dev/null
          fi
