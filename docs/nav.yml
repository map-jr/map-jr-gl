# The navigation of the docs site (website/, published at https://map-jr.org/).
#
# Each section has a title and its pages. A section with a "folder" shows every page of that folder of docs/: the
# pages that "pages" names come first, in that order, and the other pages follow by file name. A section without a
# folder shows only the files of docs/ that "pages" names. The title of a page is its first heading.
#
# A file of docs/ that no section reaches is not on the site (development.md, style-guide.md and the other files
# for people who work on the library).
sections:
  - title: Guide
    folder: guide
    pages:
      - getting-started.md
      - which-entry.md
      - view-and-camera.md
      - data.md
      - controls.md
      - images-and-fonts.md
      - color-scheme.md
      - loading.md
      - browser-support.md
      - accessibility.md
      - size-and-speed.md
      - terrain.md
      - globe.md
      - server-rendering.md
  - title: Recipes
    folder: recipes
    pages:
      - basic.md
      - reactive.md
      - markers.md
      - draggable.md
      - images.md
      - query.md
      - hover.md
      - fit.md
      - back.md
      - pmtiles.md
      - terrain.md
      - globe.md
      - clusters.md
      - control.md
      - shields.md
      - stores.md
  - title: Reference
    folder: reference
    pages:
      - create-map.md
      - description.md
      - map.md
      - state.md
      - events.md
      - exports.md
      - types.md
      - css.md
      - controls.md
      - vue.md
      - nuxt.md
      - server.md
      - react.md
      - svelte.md
      - element.md
      - maplibre-compat.md
  - title: Migrate
    folder: migrate
    pages:
      - from-maplibre.md
      - wrappers.md
      - compat-to-main-api.md
  # The documents from before the docs site. A document leaves this list when the four folders have its content.
  - title: Current docs
    pages:
      - api.md
      - vue.md
      - react.md
      - svelte.md
      - element.md
      - markers.md
      - terrain-and-elevation.md
