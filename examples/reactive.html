<!doctype html>
<meta charset="utf-8">
<title>One description, and state to watch</title>
<!-- Below the map, a line of text gives the state of the map, and two buttons change the map. -->
<map-jr id="map" map-style="https://styles.map-jr.org/1/elevation-zero.json" center="-74.0065,40.7085" zoom="13.6"
        interactive-layers="park water" style="height: 500px"></map-jr>
<p id="readout"></p>
<button id="markers">Add markers</button>
<button id="tilt">Tilt</button>
<script type="module">
  import '@map-jr/map-jr-gl/element';
  import {points} from '@map-jr/map-jr-gl';

  const dot = '<svg viewBox="0 0 12 12"><circle cx="6" cy="6" r="4.5" fill="{{color}}" stroke="#fff" stroke-width="1.5"/></svg>';
  const places = [[-74.0134, 40.7033], [-74.009, 40.7061], [-74.006, 40.7127], [-73.9969, 40.7061]];
  // The markers: a point for each place, and a symbol layer that draws the image at each point.
  const pins = points(places, {lngLat: p => p, properties: () => ({color: '#d6453d'})});
  const pinLayer = {id: 'pins', type: 'symbol', source: 'pins', layout: {'icon-image': 'dot', 'icon-allow-overlap': true, 'icon-ignore-placement': true}};

  const map = document.getElementById('map');
  const readout = document.getElementById('readout');
  const markers = document.getElementById('markers');
  map.attribution = {compact: true};
  // The image of the markers: an SVG template, 14 pixels wide and high.
  map.images = {dot: {image: dot, width: 14, height: 14}};

  // The state is a store. This function runs after each change.
  map.addEventListener('map-ready', () => map.state.subscribe(state => {
    const feature = state.hover[0];
    readout.textContent = `zoom ${state.view.zoom.toFixed(2)} · ${state.moving ? 'moving' : state.idle ? 'idle' : 'loading'} · under the pointer: ` +
      (feature ? feature.layer.id : 'nothing (move over a park or water)');
  }));

  // A change is a new value of a property. The map finds what is different.
  let shown = false;
  markers.onclick = () => {
    shown = !shown;
    map.data = shown ? {pins} : {};
    map.layers = shown ? [pinLayer] : [];
    markers.textContent = shown ? 'Remove markers' : 'Add markers';
  };
  // A change of the attribute `pitch` moves the map.
  document.getElementById('tilt').onclick = () => map.setAttribute('pitch', map.state.get().view.pitch ? '0' : '50');
</script>
