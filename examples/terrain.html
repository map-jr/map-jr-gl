<!doctype html>
<meta charset="utf-8">
<title>3D terrain, relief shading and contour lines from one elevation source</title>
<!-- Below the map, a line of text gives the elevation at a click, and two buttons change the map. -->
<map-jr id="map" map-style="https://styles.map-jr.org/1/elevation.json" center="7.6586,45.9763" zoom="12.4" pitch="60"
        bearing="25" style="height: 500px"></map-jr>
<p id="readout">Click the map to read the elevation</p>
<button id="units">Contours in metres</button>
<button id="flat">Flat map</button>
<script type="module">
  import '@map-jr/map-jr-gl/element';

  const thresholds = {
    ft: {9: [500, 1000], 11: [200, 1000], 12: [100, 500], 14: [50, 200], 15: [20, 100]},
    m: {9: [200, 1000], 11: [100, 500], 12: [50, 200], 14: [20, 100], 15: [10, 50]},
  };

  const map = document.getElementById('map');
  const readout = document.getElementById('readout');
  const units = document.getElementById('units');
  const flat = document.getElementById('flat');
  map.attribution = {compact: true};

  // Additions to the style, which has the elevation source "terrarium" and relief shading: contour lines and
  // stronger 3D terrain. `null` makes the map flat, although the style has a terrain. The style shows the heights of
  // peaks in the unit of its state "elevation-unit", so `globalState` sets the unit of the contour lines there too.
  let unit = 'ft', terrain = true;
  const showElevation = () => {
    map.terrain = terrain ? {source: 'terrarium', exaggeration: 1.5} : null;
    map.globalState = {'elevation-unit': unit};
    map.sources = {
      // For each zoom level, `thresholds` sets the interval between lines and between major lines, in feet or metres.
      contours: {type: 'contour', source: 'terrarium', multiplier: unit === 'ft' ? 3.28084 : 1, thresholds: thresholds[unit]},
    };
    map.layers = [
      {id: 'contour-lines', type: 'line', source: 'contours', 'source-layer': 'contours', before: 'water',
        paint: {'line-color': 'hsla(25, 30%, 35%, 0.55)', 'line-width': ['match', ['get', 'level'], 1, 1.2, 0.5]}},
      {id: 'contour-labels', type: 'symbol', source: 'contours', 'source-layer': 'contours', filter: ['>', ['get', 'level'], 0],
        layout: {'symbol-placement': 'line', 'text-size': 10, 'text-font': ['Noto Sans Bold'],
          'text-field': ['concat', ['number-format', ['get', 'ele'], {}], unit === 'ft' ? "'" : ' m']},
        paint: {'text-color': '#6b5a48', 'text-halo-color': '#fff', 'text-halo-width': 1.5}},
    ];
  };
  showElevation();

  map.addEventListener('map-click', async event => {
    const metres = await map.map.queryElevation(event.detail.lngLat);
    const feet = metres * 3.28084;
    readout.textContent = metres === null ? 'No elevation data here' : `${metres.toFixed(0)} m (${feet.toFixed(0)} ft) above sea level`;
  });
  units.onclick = () => {
    unit = unit === 'ft' ? 'm' : 'ft';
    units.textContent = unit === 'ft' ? 'Contours in metres' : 'Contours in feet';
    showElevation();
  };
  flat.onclick = () => {
    terrain = !terrain;
    flat.textContent = terrain ? 'Flat map' : '3D terrain';
    showElevation();
  };
</script>
