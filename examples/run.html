<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Example</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; }
  .map { height: min(520px, 100vh); position: relative; background: #e9e6df; }
  .map > .live { position: absolute; inset: 0; }
  .readout { margin: 10px 12px 0; font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; min-height: 1.4em; overflow-wrap: anywhere; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 12px; }
  .actions button { font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 8px; border: 1px solid #ccc; background: #fff; color: #222; cursor: pointer; }
  .actions button[aria-pressed="true"] { background: #222; color: #fff; }
</style>
</head>
<body>
<script type="module" src="./harness/run.js"></script>
</body>
</html>
