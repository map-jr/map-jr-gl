<!doctype html>
<meta charset="utf-8">
<title>Go back to the last view</title>
<!-- Below the map, a line of text and a button that goes back to the view before the last click. -->
<map-jr id="map" map-style="https://styles.map-jr.org/1/elevation-zero.json" center="-74.0065,40.7085" zoom="13.6"
        interactive-layers="landings" style="height: 500px"></map-jr>
<p id="readout">Click a ferry landing to zoom in.</p>
<button id="go-back" disabled>Back</button>
<script type="module">
  import '@map-jr/map-jr-gl/element';
  import {points} from '@map-jr/map-jr-gl';

  const landings = [
    {id: 1, name: 'Whitehall Terminal', lngLat: [-74.0131, 40.7013]},
    {id: 2, name: 'Pier 11 / Wall St', lngLat: [-74.0067, 40.7034]},
    {id: 3, name: 'Battery Park City', lngLat: [-74.0181, 40.7147]},
    {id: 4, name: 'Dumbo', lngLat: [-73.9946, 40.7036]},
    {id: 5, name: 'Governors Island', lngLat: [-74.0189, 40.6928]},
    {id: 6, name: 'Corlears Hook', lngLat: [-73.9785, 40.7116]},
    {id: 7, name: 'Brooklyn Bridge Park Pier 6', lngLat: [-73.9997, 40.6930]},
  ];

  const map = document.getElementById('map');
  const readout = document.getElementById('readout');
  const back = document.getElementById('go-back');
  map.attribution = {compact: true};
  map.data = {landings: points(landings, {lngLat: l => l.lngLat, properties: l => ({name: l.name})})};
  map.layers = [{id: 'landings', type: 'circle', source: 'landings', paint: {'circle-radius': 7, 'circle-color': '#2f7fd1', 'circle-stroke-width': 2, 'circle-stroke-color': '#fff'}}];

  let last = null;
  map.addEventListener('map-click', event => {
    const feature = event.detail.features[0];
    if (!feature) return;
    // Store the view before the move, without `bounds`: a target with `bounds` fits that box instead. `map.map` is the
    // map of the element.
    const {center, zoom, bearing, pitch} = map.state.get().view;
    last = {center, zoom, bearing, pitch};
    map.map.moveTo({center: feature.geometry.coordinates, zoom: 17, duration: 800});
    back.disabled = false;
    readout.textContent = `${feature.properties.name}. Press Back to return.`;
  });

  // `moveTo` and not the attributes `center` and `zoom`: `moveTo` always moves the map.
  back.onclick = () => {
    map.map.moveTo({...last, duration: 800});
    back.disabled = true;
    readout.textContent = 'Click a ferry landing to zoom in.';
  };
</script>
